line-length = 120
# Python 3.11 is what runs in production (Dockerfile) and in CI. Without an explicit target,
# ruff uses its own default, which moved from py310 to py311 in 0.17 and turned UP017 red
# without any code change.
target-version = "py311"
exclude = ["alembic/"]

[lint]
select = ["E", "F", "W", "I", "UP"]
# E501: long lines (cosmetic, existing code style)
# E701/E702: multi-statement lines (existing code style — address incrementally)
ignore = ["E501", "E701", "E702"]
